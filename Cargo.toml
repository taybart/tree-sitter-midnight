[package]
authors = [ "Taylor Bartlett <taylor.bartlett@journey.ai>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Erde grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "erde" ]
license = "MIT"
name = "tree-sitter-erde"
readme = "README.md"
repository = "https://github.com/taybart/tree-sitter-erde"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
